name: Deploy to Production

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and push Docker images
      run: |
        # Backend
        docker build -t yourorg/erp-backend:latest ./backend
        docker push yourorg/erp-backend:latest
        
        # Frontend
        docker build -t yourorg/erp-frontend:latest ./frontend
        docker push yourorg/erp-frontend:latest

    - name: Deploy to production server
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.PROD_HOST }}
        username: ${{ secrets.PROD_USERNAME }}
        key: ${{ secrets.PROD_SSH_KEY }}
        script: |
          cd /opt/erp-system
          
          # Pull latest images
          docker-compose pull
          
          # Run database migrations
          docker-compose run --rm backend python manage.py migrate
          
          # Collect static files
          docker-compose run --rm backend python manage.py collectstatic --noinput
          
          # Restart services
          docker-compose up -d
          
          # Health check
          sleep 30
          curl -f http://localhost:8000/api/health/ || exit 1
          curl -f http://localhost:3000 || exit 1

    - name: Run smoke tests
      run: |
        sleep 60  # Wait for services to be fully up
        
        # API health check
        curl -f ${{ secrets.PROD_API_URL }}/api/health/ || exit 1
        
        # Frontend health check
        curl -f ${{ secrets.PROD_FRONTEND_URL }}/ || exit 1
        
        # Test authentication endpoint
        curl -f -X POST \
          ${{ secrets.PROD_API_URL }}/api/token/ \
          -H "Content-Type: application/json" \
          -d '{"username": "test", "password": "test"}' || true

    - name: Notify deployment
      uses: 8398a7/action-slack@v3
      if: always()
      with:
        status: ${{ job.status }}
        channel: '#deployments'
        webhook_url: ${{ secrets.SLACK_WEBHOOK }}
        fields: repo,message,commit,author,action,eventName,ref,workflow